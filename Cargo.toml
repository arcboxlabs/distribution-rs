[package]
name = "distribution"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["ArcBox Labs <team@arcbox.dev>", "AprilNEA <dev@aprilnea.me>"]
description = "A high-performance OCI Distribution Spec v1.1 registry implementation in Rust"
repository = "https://github.com/arcboxlabs/distribution-rs"
homepage = "https://github.com/arcboxlabs/distribution-rs"
license = "MIT OR Apache-2.0"
keywords = ["oci", "container", "registry", "docker", "distribution"]
categories = ["command-line-utilities", "web-programming::http-server"]
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["tokio"] }
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
form_urlencoded = "1"
futures = "0.3"
hex = "0.4"
jsonwebtoken = "9"
oci-spec = "0.7"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
